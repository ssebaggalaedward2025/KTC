# Local development stack for BPTMS.
# Usage: cp .env.example .env && docker compose up -d && docker compose exec app composer setup
name: bptms

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  volumes:
    - ./:/var/www/html
  env_file: .env
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_started }

services:
  app:
    <<: *app

  queue:
    <<: *app
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    restart: unless-stopped

  scheduler:
    <<: *app
    command: php artisan schedule:work
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bptms}
      MYSQL_USER: ${DB_USERNAME:-bptms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports: ["3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]   # start with: docker compose --profile scan up -d

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

volumes:
  mysql-data:
  redis-data:
