name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bptms_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost" --health-interval=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, intl, zip, gd, bcmath, exif, redis
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer audit (known vulnerabilities)
        run: composer audit --no-interaction

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests (Pest, SQLite)
        run: |
          cp .env.example .env
          php artisan key:generate
          vendor/bin/pest --compact

      - name: Tests (Pest, MySQL 8)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bptms_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/pest --compact

  image-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f docker/php/Dockerfile --target prod -t bptms:ci .
      - name: Scan image and dependencies (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bptms:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
