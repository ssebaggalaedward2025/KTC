; Production (Ubuntu VPS) Supervisor config. Copy to /etc/supervisor/conf.d/bptms.conf
[program:bptms-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/bptms/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/bptms/storage/logs/queue.log
